name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # npm OIDC trusted publishing
  contents: write   # gh release create

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # runner 自带的 npm 10.x 不支持 Trusted Publishing 的 OIDC 握手,
      # 会静默回退匿名请求并被 registry 以误导性 404 拒绝(npm/cli#9088),
      # 必须升级到 npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # 版本守卫:tag v0.0.2 必须与 package.json version 一致,防止发错版本
      - name: Verify tag matches package.json version
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.argv[1];
            if ('v' + pkg.version !== tag) {
              console.error('tag ' + tag + ' != package.json version v' + pkg.version);
              process.exit(1);
            }
            console.log('version check ok: v' + pkg.version);
          " "${{ github.ref_name }}"
      - run: npm publish
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "Release ${{ github.ref_name }}"
